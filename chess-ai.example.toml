# chess-ai global configuration.
#
# Copy this file to chess-ai.toml in the directory you run chess-ai from, or point
# the CHESS_AI_CONFIG environment variable or the --config option at it. Every
# setting has the default shown here.
#
# Each setting can be overridden by an environment variable named
# CHESS_AI_<SECTION>_<KEY>, for example CHESS_AI_SERVER_PORT=9000.

[server]
# Address to listen on. Use "0.0.0.0" to accept connections from other machines,
# for example when nginx runs elsewhere or on the Windows side of WSL2.
host = "127.0.0.1"
port = 8000

# URL path the web app is served under, such as "/chess" for
# https://example.com/chess/. Pages, assets and the API all live under it, so a
# reverse proxy can forward requests unchanged. Empty serves at the root.
path_prefix = ""

# How many seconds a running training run's heartbeat may go without being
# updated before the runs dashboard flags the run as stale: its trainer has most
# likely died without saying so. A trainer updates the heartbeat every couple of
# seconds while it trains, but not while it starts up, validates or saves a
# checkpoint, so leave room for those.
stale_after_seconds = 120

[paths]
# Where the games played here are saved, one PGN file per game. Every game that
# reaches a result is saved as it ends; an aborted game reached none and is not
# saved. A relative path is relative to the directory chess-ai runs in, and a
# leading ~ is your home directory. The directory is made when it is first needed.
games = "games"

# Where datasets built from PGN files are kept, one directory per dataset under
# <data>/datasets/. A dataset holds sharded record files and a manifest, and can
# reach tens of gigabytes, so this may be worth pointing at a roomier disk. A
# relative path is relative to the directory chess-ai runs in, and a leading ~ is
# your home directory. The directory is made when it is first needed.
data = "data"

# Where training runs are kept, one directory per run: the config it was started
# from, its metrics log, its heartbeat and its checkpoints. Checkpoints are the
# large part, and how many are kept is the run's own business (see the
# [checkpoints] section of an experiment config). A relative path is relative to
# the directory chess-ai runs in, and a leading ~ is your home directory. The
# directory is made when it is first needed.
runs = "runs"

# Where the games the server holds are kept while they last, one JSON file per
# game, so that a restart carries on with them. A game is deleted from here once
# it has expired (see [games] expire_after_days), or at once if it is aborted.
ongoing_games = "ongoing-games"

[inference]
# Where to run a model player's network: "cpu", "cuda", or "auto" for a GPU if
# there is one. The CPU by default, deliberately: the machine that plays is
# usually the machine that is training, a game asks about one position at a time,
# and a training run should have the card to itself.
device = "cpu"

# How many positions go through the network at once when several are asked about,
# which a game never is and an evaluation suite will be. Small, for the same
# reason as the device above.
batch_size = 32

[stockfish]
# The Stockfish binary that games can be played against: a path, or a bare name
# looked up on PATH. A leading ~ is your home directory. Not needed unless a game
# asks for Stockfish; see the README for installing it.
path = "stockfish"

[games]
# How many games may be in progress at once. Every game is reached through its
# own links, so several people can play at the same time; a new game beyond this
# number is refused until one has ended.
max_ongoing = 20

# How many checkpoints the games may hold loaded at once, all games together.
# Games playing the same checkpoint share one copy. Beyond this, the checkpoint
# used longest ago is let go of and loaded again when a game next needs it.
max_loaded_checkpoints = 10

# How many hours a loaded checkpoint that no game has played with is kept before
# it is let go of, so that a game left for the day holds no memory meanwhile.
checkpoint_idle_hours = 24

# How many days a game is kept after its last move, finished or not, before it
# is deleted along with its links. Every move, and the game ending, starts the
# count again.
expire_after_days = 7

[ladder]
# The Stockfish ladder that `chess-ai ladder` measures a checkpoint's Elo on: the
# checkpoint plays a match against Stockfish at each level, and its Elo, with a
# 95% range, is worked out from how it scored. The command line can override
# each of these for one ladder.

# Stockfish's Elo levels. A level outside the range Stockfish supports is played
# at the nearest end of it (1350 to 2850 for Stockfish 14), and a checkpoint that
# scores below the lowest level is reported as below it, not given a number.
levels = [1350, 1500, 1700, 1900, 2100]

# How many games the checkpoint plays against each level, the colours swapped
# every game.
games_per_level = 20

# The rating the checkpoint is asked to play like. A model asked for no rating
# plays far below what it can do, so a ladder always asks for one.
rating = 2000

# Seconds Stockfish has for each move. Its levels were calibrated at a few seconds
# a move, so at a tenth of a second it plays below them: the Elo is on Stockfish's
# scale at this move time, and only ladders played at one move time compare.
move_time = 0.1

# The opening set the games start from: one that comes with chess-ai, or the
# path of a file of your own.
openings = "standard"

# Where the checkpoint's network runs: "cpu", "cuda", or "auto" for a GPU if
# there is one. Unlike [inference] device, a GPU by default: a ladder asks about
# thousands of positions, which is slow on a CPU and light work for a GPU.
device = "auto"

[evaluator]
# The evaluator, `chess-ai evaluator`, is a process of its own that evaluates every
# new checkpoint of every run (archived ones aside) with the suites its experiment
# config names, once each. `chess-ai evaluate` runs suites again on demand.

# Where a checkpoint's network runs: "cpu", "cuda", or "auto" for a GPU if there
# is one. The CPU by default, so that a training run keeps the card to itself.
device = "cpu"

# How many positions go through the network at once.
batch_size = 16

# How many CPU threads the network may use. Torch would otherwise take every core,
# and a training run's data loaders are using them.
threads = 2

# How many seconds to wait before looking for new checkpoints again, once every
# checkpoint found has been evaluated.
poll_seconds = 30

# The rating a checkpoint is asked about the probe positions at, for both sides.
rating = 2000

# The probe positions: a set that comes with chess-ai, or the path of a file of
# your own. A different set, or a new version of this one, probes every
# checkpoint still on disk again.
probe_set = "standard"

[sample_games]
# The sample games the evaluator plays with each checkpoint of a run whose
# [evaluation] suites name "sample-games" (the default), shown live on the run's
# page as they are played and saved as PGN in the run directory. Changing these
# plays no checkpoint's games again; `chess-ai evaluate --suite sample-games` does.

# How many games the checkpoint plays against itself, each from a line of the
# opening set of its own: a model that always plays its likeliest move would play
# a line the same way from both sides.
games = 2

# How many games it plays against Stockfish, the colours swapped every game. Not
# both 0: leave "sample-games" out of a run's suites instead.
stockfish_games = 0

# The Elo Stockfish plays those at, and the seconds it has for each move.
stockfish_elo = 1350
stockfish_move_time = 0.1

# The rating the checkpoint is asked to play like.
rating = 2000

# The opening set the games start from: one that comes with chess-ai, or the path
# of a file of your own. Every checkpoint starts from the same lines, so that their
# games can be compared.
openings = "standard"

# The least number of seconds between two moves, so that the games can be
# followed on the run page. Every second of it is a second the evaluator spends
# on each move, and on a small network on the GPU a game takes a few seconds.
move_delay = 0
