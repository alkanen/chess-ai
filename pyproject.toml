[project]
name = "chess-ai"
version = "0.1.0"
description = "Train neural-network chess players on human games and watch them learn in the browser"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
chess-ai = "chess_ai.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
