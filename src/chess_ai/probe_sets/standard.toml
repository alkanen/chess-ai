# The standard probe set: positions every checkpoint of a run is shown, to see what it makes
# of them as it trains.
#
# A probe is a position and a label. The position is reached by playing ``moves`` (standard
# notation) from ``fen``, which is the usual starting position when left out, so that a model
# that reads the moves before a position sees the ones that led here. ``best`` lists the moves
# that solve a probe that has a solution: a mate, a tactic, a won endgame with one way to win.
# Positions without one are there to watch what the model prefers, and say nothing is wrong.
#
# Every ``best`` was checked with Stockfish 14.1 at depth 20 when it was added: each listed move
# is clearly better than every move left out. ``id`` names a probe across versions of the set,
# so it never changes once a probe has it, even when its name or comment does.
#
# The set is versioned: results measured on one version are compared only with results
# measured on the same one. Changing, adding, removing or reordering a probe raises the
# version, and the test that pins this set's contents with it. Raising it makes the evaluator
# probe every checkpoint still on disk again.

name = "standard"
version = 1

# Openings: what the model has picked up of how games start.

[[probes]]
id = "start"
name = "Starting position"
category = "opening"

