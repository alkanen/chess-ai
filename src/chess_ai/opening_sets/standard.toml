# The standard opening set: where the games of a match start.
#
# Argmax play is deterministic, so two checkpoints that start every game from the starting
# position play the same game every time. Each game of a match starts from one of these lines
# instead, and each line is played twice, once with either player on either side.
#
# The lines are main-line theory, a few moves deep, chosen to cover the openings people
# actually play rather than to test anything in particular. Each was checked with Stockfish
# when it was added: none leaves either side much more than a pawn worse, and no two reach the
# same position. Their order mixes the openings up, so that a short match still plays a spread
# of them rather than ten Sicilians.
#
# The set is versioned: two matches that name the same set and version started from the same
# positions, in the same order. Changing, adding, removing or reordering a line changes what a
# match plays, so it raises the version, and the test that pins this set's contents with it.

name = "standard"
version = 1

