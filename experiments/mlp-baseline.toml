# An experiment config: everything one training run depends on, in one file.
#
#   chess-ai train experiments/mlp-baseline.toml
#
# The file is copied into the run directory as it is, comments and all, so a run can
# always be traced back to what produced it. Only [dataset] has to be filled in.
#
# Every option is listed, with the built-in default noted beside it: a line you delete
# falls back to that default, and a value that differs from it is this file's own choice.
# The notes are checked against the code by the test suite, so they cannot drift.
#
# The run is named after this file unless `name` says otherwise, and `--name` on the
# command line overrides both, which is how the same config is run more than once.

name = "mlp-baseline"

# Draws the initial weights and the order positions are visited in. The same seed on
# the same data and the same code gives the same run.
seed = 1234                                # default: 0

[dataset]
# A dataset built with `chess-ai dataset build`, by name, in the data directory.
# Its train split is trained on and its validation split is measured on; the dataset
# decided which games went where, so no positions from one game are in both.
name = "carlsen"

[encoder]
# What the network is shown. "board-planes" gives a plane per piece type and colour
# on an 8x8 grid, plus a separate vector of what is not on the board: side to move,
# castling rights, en passant, the halfmove clock, and both players' ratings.
name = "board-planes"                      # default: "board-planes"

# What a rating is divided by to become a feature. The default leaves room above
# today's top ratings, so a 3000 is 0.6 and the pools can inflate without the feature
# leaving the range the model was trained on.
rating_scale = 5000.0                      # default: 5000.0

# How many earlier positions of the game are shown behind the current one, as 12 more
# planes each. 0 shows the position alone. Planes for positions before the game began
# are all zero.
history = 0                                # default: 0

# Which way up the board is shown. "absolute" is always from white's side.
# "side-to-move" turns it around when black is to move, so the mover's pieces are
# always on the same planes and always play up the board; the castling features and
# the moves the model predicts are turned with it, and turned back when it plays.
orientation = "absolute"                   # default: "absolute"

[model]
# Which architecture, by its registered name. Everything below this line is that
# architecture's own hyperparameters, so a typo is refused rather than ignored.
architecture = "mlp"                       # default: "mlp"

depth = 3                                  # default: 3
width = 1024                               # default: 1024
dropout = 0.0                              # default: 0.0

[training]
# "auto" uses the GPU when there is one and the CPU when there is not. Naming "cuda"
# explicitly fails on a machine without one, rather than quietly training 200x slower.
device = "auto"                            # default: "auto"

batch_size = 1024                          # default: 1024

# How much the win/draw/loss head counts next to the policy. The policy is the point;
# the value head is there so the network has some notion of who is winning.
value_loss_weight = 0.5                    # default: 0.5

# bfloat16 for the forward and backward passes, on an Ampere or newer card. Older
# cards and the CPU train in float32 instead, and say so.
mixed_precision = true                     # default: true

# Processes that read and encode batches while the GPU trains. 0 does it inline.
data_workers = 8                           # default: 4

log_every_steps = 50                       # default: 50

[optimizer]
learning_rate = 1e-3                       # default: 0.001
weight_decay = 0.01                        # default: 0.01
beta1 = 0.9                                # default: 0.9
beta2 = 0.95                               # default: 0.95
epsilon = 1e-8                             # default: 1e-08

# Largest gradient norm allowed through. 0 turns clipping off.
gradient_clip = 1.0                        # default: 1.0

[schedule]
# How long the run is. One step is one batch, so steps * batch_size / positions is
# how many times over the data it goes; the run prints that before it starts.
steps = 30000                              # default: 10000

# Linear warmup, then cosine decay to min_learning_rate_fraction of the learning rate.
warmup_steps = 500                         # default: 500
min_learning_rate_fraction = 0.1           # default: 0.1

[validation]
# The same positions every time, from the front of the validation split, so that the
# curve across steps is measured on one thing. More positions costs time per pass and
# buys a less noisy curve.
#
# every_steps is a floor, not the whole story: a checkpoint step validates too, so that
# the metrics kept with a checkpoint were measured on that checkpoint. When the two
# schedules below do not divide each other that means extra passes, and the run says how
# many before it starts.
every_steps = 500                          # default: 500
positions = 16384                          # default: 16384

[checkpoints]
# Every this many steps, and at the last step. Each of those steps also validates, which
# is what lets `metric` below mean something for every checkpoint that is kept.
every_steps = 500                          # default: 1000

# The most recent this many are kept, plus the best one wherever it is.
keep = 3                                   # default: 3

# Which validation metric decides "best": loss, policy_loss, value_loss, top1, top5
# or illegal_top_move_rate.
metric = "policy_loss"                     # default: "policy_loss"
